; Copy to config.ini (which git ignores) and fill in.
;
; The API key belongs to one ERPNext user made for the agent, with the
; "ZK Agent" role and nothing else. Whoever holds it can add and remove people
; from every door, so it stays on this PC.

[erpnext]
url = https://momc-erp.sy
api_key =
api_secret =

[agent]
; How this PC is named in ERPNext (ZK Settings > Agent Computer, ZK Job > Agent).
name = office-pc
; Devices read at once when refreshing state (faces and photos take ~3 minutes a device).
bio_workers = 4
; A full sync that runs longer than this is stopped and its job marked failed.
sync_timeout_minutes = 240
